<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1261" viewBox="0 0 960 1261" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .msg { font-size: 13px; fill: #0f172a; }
    .who { font-size: 12px; font-weight: 700; }
    .badge { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .note { font-size: 11px; fill: #64748b; }
  </style>
  <rect width="960" height="1261" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Demo call on the July-2025 stack (recorded): substitute, slot, address change, note, booking</text>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#64748b">Exact transcript from the call record. Customer lines are what Whisper heard ("Haldoram"). Badges: customer stopped speaking → agent audio started.</text>
  <text x="480" y="74" text-anchor="middle" font-size="12" fill="#64748b">Reply latency: median 801 ms, max 2264 ms</text>
  <text x="24" y="116" text-anchor="start" class="who" fill="#7c3aed">Avio</text><rect x="94" y="96" width="600" height="60" rx="12" fill="#f5f3ff" stroke="#7c3aed"/><text x="108" y="121" class="msg">Hi, this is Avio calling from AvioStack about your grocery order. Am I</text><text x="108" y="140" class="msg">speaking with Arjun?</text><text x="704" y="115" class="note">pre-synthesized</text><text x="936" y="190" text-anchor="end" class="who" fill="#0891b2">You</text><rect x="266" y="170" width="600" height="41" rx="12" fill="#ecfeff" stroke="#0891b2"/><text x="280" y="195" class="msg">Yes, this is Arjun.</text><text x="24" y="245" text-anchor="start" class="who" fill="#7c3aed">Avio</text><rect x="94" y="225" width="600" height="98" rx="12" fill="#f5f3ff" stroke="#7c3aed"/><text x="108" y="250" class="msg">Great. Your order has 1 Bru tea powder, 1 Surf detergent powder, 2 Lays</text><text x="108" y="269" class="msg">salted peanuts and 2 Harvest pav buns. The Lays salted peanuts is out of</text><text x="108" y="288" class="msg">stock. Would you like Haldiram salted peanuts instead, the rest without it</text><text x="108" y="307" class="msg">or to wait until it&#x27;s back Monday?</text><rect x="704" y="229" width="62" height="22" rx="11" fill="#d97706"/><text x="735" y="244" text-anchor="middle" class="badge">985 ms</text><text x="936" y="357" text-anchor="end" class="who" fill="#0891b2">You</text><rect x="266" y="337" width="600" height="41" rx="12" fill="#ecfeff" stroke="#0891b2"/><text x="280" y="362" class="msg">Yes, the Haldoram peanuts are fine.</text><text x="24" y="412" text-anchor="start" class="who" fill="#7c3aed">Avio</text><rect x="94" y="392" width="600" height="41" rx="12" fill="#f5f3ff" stroke="#7c3aed"/><text x="108" y="417" class="msg">Got it. When would you like it delivered?</text><rect x="704" y="396" width="62" height="22" rx="11" fill="#d97706"/><text x="735" y="411" text-anchor="middle" class="badge">1134 ms</text><text x="936" y="467" text-anchor="end" class="who" fill="#0891b2">You</text><rect x="266" y="447" width="600" height="41" rx="12" fill="#ecfeff" stroke="#0891b2"/><text x="280" y="472" class="msg">Tomorrow evening, please.</text><text x="24" y="522" text-anchor="start" class="who" fill="#7c3aed">Avio</text><rect x="94" y="502" width="600" height="41" rx="12" fill="#f5f3ff" stroke="#7c3aed"/><text x="108" y="527" class="msg">Okay. I can deliver tomorrow, 5 to 6 PM. Shall I book that?</text><rect x="704" y="506" width="62" height="22" rx="11" fill="#d97706"/><text x="735" y="521" text-anchor="middle" class="badge">864 ms</text><text x="936" y="577" text-anchor="end" class="who" fill="#0891b2">You</text><rect x="266" y="557" width="600" height="41" rx="12" fill="#ecfeff" stroke="#0891b2"/><text x="280" y="582" class="msg">Yes, book that.</text><text x="24" y="632" text-anchor="start" class="who" fill="#7c3aed">Avio</text><rect x="94" y="612" width="600" height="41" rx="12" fill="#f5f3ff" stroke="#7c3aed"/><text x="108" y="637" class="msg">Great. Should we deliver to 230 BTM Layout 2nd Stage, Bengaluru?</text><rect x="704" y="616" width="62" height="22" rx="11" fill="#d97706"/><text x="735" y="631" text-anchor="middle" class="badge">2264 ms</text><text x="936" y="687" text-anchor="end" class="who" fill="#0891b2">You</text><rect x="266" y="667" width="600" height="41" rx="12" fill="#ecfeff" stroke="#0891b2"/><text x="280" y="692" class="msg">No, deliver it to 42 Church Street. Bengaluru.</text><text x="24" y="742" text-anchor="start" class="who" fill="#7c3aed">Avio</text><rect x="94" y="722" width="600" height="60" rx="12" fill="#f5f3ff" stroke="#7c3aed"/><text x="108" y="747" class="msg">Okay. Just to check, the new address is 42 Church Street. Bengaluru. Is that</text><text x="108" y="766" class="msg">right?</text><rect x="704" y="726" width="62" height="22" rx="11" fill="#16a34a"/><text x="735" y="741" text-anchor="middle" class="badge">642 ms</text><text x="936" y="816" text-anchor="end" class="who" fill="#0891b2">You</text><rect x="266" y="796" width="600" height="41" rx="12" fill="#ecfeff" stroke="#0891b2"/><text x="280" y="821" class="msg">Yes, that&#x27;s right.</text><text x="24" y="871" text-anchor="start" class="who" fill="#7c3aed">Avio</text><rect x="94" y="851" width="600" height="60" rx="12" fill="#f5f3ff" stroke="#7c3aed"/><text x="108" y="876" class="msg">Got it. I&#x27;ve updated the address to 42 Church Street. Bengaluru. Any</text><text x="108" y="895" class="msg">instructions for the driver?</text><rect x="704" y="855" width="62" height="22" rx="11" fill="#16a34a"/><text x="735" y="870" text-anchor="middle" class="badge">715 ms</text><text x="936" y="945" text-anchor="end" class="who" fill="#0891b2">You</text><rect x="266" y="925" width="600" height="41" rx="12" fill="#ecfeff" stroke="#0891b2"/><text x="280" y="950" class="msg">Please leave it with the security guard.</text><text x="24" y="1000" text-anchor="start" class="who" fill="#7c3aed">Avio</text><rect x="94" y="980" width="600" height="98" rx="12" fill="#f5f3ff" stroke="#7c3aed"/><text x="108" y="1005" class="msg">Noted. To confirm, 1 Bru tea powder, 1 Surf detergent powder, 2 Haldiram</text><text x="108" y="1024" class="msg">salted peanuts instead of Lays salted peanuts and 2 Harvest pav buns,</text><text x="108" y="1043" class="msg">delivered tomorrow, 5 to 6 PM, to 42 Church Street. Bengaluru. Shall I book</text><text x="108" y="1062" class="msg">it?</text><rect x="704" y="984" width="62" height="22" rx="11" fill="#16a34a"/><text x="735" y="999" text-anchor="middle" class="badge">738 ms</text><text x="936" y="1112" text-anchor="end" class="who" fill="#0891b2">You</text><rect x="266" y="1092" width="600" height="41" rx="12" fill="#ecfeff" stroke="#0891b2"/><text x="280" y="1117" class="msg">Yes, book it.</text><text x="24" y="1167" text-anchor="start" class="who" fill="#7c3aed">Avio</text><rect x="94" y="1147" width="600" height="60" rx="12" fill="#f5f3ff" stroke="#7c3aed"/><text x="108" y="1172" class="msg">Perfect. Your delivery is booked for tomorrow, 5 to 6 PM. Thank you,</text><text x="108" y="1191" class="msg">goodbye!</text><rect x="704" y="1151" width="62" height="22" rx="11" fill="#16a34a"/><text x="735" y="1166" text-anchor="middle" class="badge">626 ms</text>
  <text x="24" y="1245" font-size="11" fill="#64748b">Outcome: order booked for tomorrow 5–6 PM · substitute applied · new address saved only after "Yes, that's right." · note saved · 0 unrequested changes</text>
</svg>
