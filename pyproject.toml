[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-voice-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
bench = [
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "sounddevice>=0.4.6",
  "httpx>=0.27",
  "huggingface_hub>=0.30",
  "transformers>=5.13",
  "faster-whisper>=1.2",
  "sherpa-onnx>=1.12",
  "kokoro-onnx>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
