[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-voice-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
bench = [
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "sounddevice>=0.4.6",
  "httpx>=0.27",
  "huggingface_hub>=0.30",
  "transformers>=5.13",
  "faster-whisper>=1.2",
  "sherpa-onnx>=1.12",
  "kokoro-onnx>=0.6",
  "kokoro>=0.9.4",
  "librosa>=0.10",
]
agent = [
  # Period-accurate stack: everything here was released on or before 31 July 2025.
  # Install with: uv pip install --exclude-newer 2025-08-01 -e ".[dev,agent]"  (torch 2.7.1 from the cu128 index)
  "pipecat-ai[webrtc,whisper,silero]==0.0.77",
  "pipecat-ai-small-webrtc-prebuilt==1.0.0",
  "av==14.2.0",  # 14.3/14.4 shipped no Windows wheel for Python 3.11
  "kokoro==0.9.4",
  "transformers==4.54.1",
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
  "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "tests"]
